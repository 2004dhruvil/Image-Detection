<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - DeepFake Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div class="background-animation">
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
    </div>

    <div class="container glass-panel" style="border-color: var(--secondary-color);">
        <header>
            <h2 class="glow-text"
                style="background: linear-gradient(90deg, #ff0055, #bd00ff); -webkit-background-clip: text;">Admin Panel
            </h2>
            <p class="subtitle">Authorized Personnel Only</p>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}"
            style="color: {{ '#00ff88' if category == 'success' else '#ff0055' }}; margin-bottom: 1rem;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="input-group">
                <i class="fas fa-user-shield"></i>
                <input type="text" name="username" placeholder="Admin Username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="cta-btn" style="background: linear-gradient(90deg, #ff0055, #bd00ff);">Login as
                Admin</button>
        </form>

        <p class="auth-link"><a href="{{ url_for('login') }}">Back to User Login</a></p>
    </div>

</body>

</html>
